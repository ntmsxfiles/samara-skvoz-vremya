<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:dark}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Самара сквозь время</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#08090a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prata&display=swap">
<style>
/* Layout: one fullscreen stage. A WebGL hologram lives behind every screen; home is a horizontal pager of buildings, the on-site view puts the phone camera under the same canvas. Single dark look by design. */
:root{
  --black:#08090a;
  --ink:#f2efe8;
  --dim:rgba(242,239,232,.64);
  --faint:rgba(242,239,232,.18);
  --glass:rgba(10,10,11,.56);
  --glow:#ffc978;
  --serif:"Prata","Bodoni 72","Didot",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;background:var(--black);color:var(--ink)}
body{font:17px/1.5 var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
h2,h3,p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--glow);outline-offset:3px}

#app{position:fixed;inset:0;overflow:hidden;background:radial-gradient(120% 75% at 50% 34%,#1b1812 0%,#0c0c0d 58%,var(--black) 100%)}
#app.live{background:#000}
#cam{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;max-width:none;z-index:0}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:1;touch-action:none}
.screen{position:absolute;inset:0;z-index:2}

/* shared type */
.when{font:400 20px/1.2 var(--serif);color:var(--glow);letter-spacing:.01em}
.title{font:400 clamp(38px,10vw,68px)/1.03 var(--serif);letter-spacing:-.012em;text-wrap:balance}
.lead{font-size:18px;line-height:1.5;color:var(--dim);max-width:36ch}
.cta{display:flex;flex-wrap:wrap;align-items:center;gap:8px 26px;margin-top:8px}
.btn{appearance:none;border:0;border-radius:999px;background:var(--ink);color:var(--black);font-weight:600;font-size:17px;line-height:1;padding:18px 28px;cursor:pointer;transition:transform .15s}
.btn:active{transform:scale(.97)}
.link{appearance:none;border:0;background:none;padding:12px 0;font-size:17px;font-weight:500;cursor:pointer;color:var(--ink);text-decoration:underline;text-decoration-color:var(--faint);text-underline-offset:6px}
.round{position:absolute;z-index:6;top:calc(env(safe-area-inset-top,0px) + 14px);left:max(16px,env(safe-area-inset-left,0px));width:48px;height:48px;border-radius:50%;border:1px solid var(--faint);background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);display:grid;place-items:center;cursor:pointer;pointer-events:auto}
.round svg{width:18px;height:18px}
.round.right{left:auto;right:max(16px,env(safe-area-inset-right,0px))}
.reticle{position:absolute;left:50%;top:42%;width:min(68vw,320px);aspect-ratio:1;transform:translate(-50%,-50%);color:rgba(255,201,120,.7);transition:color .3s,filter .3s;pointer-events:none}
.reticle svg{width:100%;height:100%;overflow:visible}
.reticle.on{color:var(--glow);filter:drop-shadow(0 0 10px rgba(255,201,120,.85))}
.aim{display:grid;gap:16px}
.aim p{font-size:18px;line-height:1.45}
.ctl{display:grid;gap:12px}

/* home */
.brand{position:absolute;z-index:3;top:calc(env(safe-area-inset-top,0px) + 20px);left:max(24px,env(safe-area-inset-left,0px));font:400 22px/1.2 var(--serif);pointer-events:none}
.brand span{color:var(--dim)}
.pager{position:absolute;inset:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.pager::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;scroll-snap-stop:always;display:flex;align-items:flex-end;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));padding-bottom:calc(env(safe-area-inset-bottom,0px) + 84px)}
.slide-in{display:grid;gap:14px;max-width:640px}
.dots{position:absolute;z-index:3;left:max(24px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 30px);display:flex;gap:6px}
.dots button{appearance:none;border:0;background:none;width:34px;height:24px;padding:0;cursor:pointer;position:relative}
.dots button::after{content:"";position:absolute;left:0;right:0;top:11px;height:2px;border-radius:2px;background:var(--faint);transition:background .3s}
.dots button[aria-current="true"]::after{background:var(--ink)}
.arrows{position:absolute;z-index:3;right:max(24px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 22px);display:none;gap:10px}
.arrows button{appearance:none;width:52px;height:52px;border-radius:50%;border:1px solid var(--faint);background:none;cursor:pointer;display:grid;place-items:center}
.arrows svg{width:20px;height:20px}
@media (hover:hover) and (min-width:900px){.arrows{display:flex}.slide{padding-left:max(64px,env(safe-area-inset-left,0px))}.brand,.dots{left:64px}}

/* on-site view */
#ar{pointer-events:none}
#spots{position:absolute;inset:0;overflow:hidden}
.spot{position:absolute;left:0;top:0;width:48px;height:48px;margin:-24px 0 0 -24px;border:0;background:none;padding:0;cursor:pointer;pointer-events:auto;will-change:transform}
.spot::before{content:"";position:absolute;inset:17px;border-radius:50%;background:var(--glow);box-shadow:0 0 16px 5px rgba(255,201,120,.55)}
.spot::after{content:"";position:absolute;inset:7px;border-radius:50%;border:1.5px solid rgba(255,201,120,.85);animation:ring 2.6s ease-out infinite}
.spot[aria-pressed="true"]::before{background:#fff}
@keyframes ring{from{transform:scale(.45);opacity:1}to{transform:scale(1.45);opacity:0}}
.guide{position:absolute;top:44%;display:flex;align-items:center;gap:12px;font:400 22px/1 var(--serif);color:var(--glow);text-shadow:0 0 20px rgba(255,201,120,.65);transition:opacity .3s}
.guide svg{width:30px;height:30px;filter:drop-shadow(0 0 10px rgba(255,201,120,.8))}
.guide.l{left:max(18px,env(safe-area-inset-left,0px))}
.guide.r{right:max(18px,env(safe-area-inset-right,0px));flex-direction:row-reverse}
.guide.r svg{transform:scaleX(-1)}
.toast{position:absolute;top:calc(env(safe-area-inset-top,0px) + 78px);left:0;right:0;margin-inline:auto;width:fit-content;max-width:calc(100% - 48px);padding:13px 20px;border-radius:16px;background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);font-size:16px;line-height:1.4;text-align:center;opacity:0;transition:opacity .45s;pointer-events:none}
.toast.on{opacity:1}
.onboard{position:absolute;inset:0;display:flex;align-items:flex-end;pointer-events:auto;background:linear-gradient(rgba(8,9,10,0) 28%,rgba(8,9,10,.9) 72%);padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));padding-bottom:calc(env(safe-area-inset-bottom,0px) + 40px)}
.onboard .panel{display:grid;gap:14px;max-width:600px;margin:0 auto 0 0}
.bar{position:absolute;left:0;right:0;bottom:0;pointer-events:none;background:linear-gradient(rgba(8,9,10,0),rgba(8,9,10,.72) 46%);padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-bottom:calc(env(safe-area-inset-bottom,0px) + 18px)}
.bar-in{max-width:620px;margin:0 auto;display:grid;gap:12px;padding-top:56px;pointer-events:auto}
.bar-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px}
.bar-head h2{font:400 28px/1.1 var(--serif);min-width:0}
.card{background:rgba(16,15,13,.74);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--faint);border-radius:20px;padding:18px 20px;display:grid;gap:6px}
.card h3{font:400 22px/1.2 var(--serif);color:var(--glow)}
.card p{font-size:17px;line-height:1.45}
.time{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:16px;font-size:16px;color:var(--dim)}
.time .y{font:400 20px/1 var(--serif);color:var(--glow)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:36px;background:transparent;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:2px;border-radius:2px;background:linear-gradient(90deg,var(--glow) var(--p,100%),var(--faint) var(--p,100%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;margin-top:-12px;border-radius:50%;background:var(--glow);box-shadow:0 0 20px rgba(255,201,120,.75)}
input[type=range]::-moz-range-track{height:2px;background:var(--faint)}
input[type=range]::-moz-range-progress{height:2px;background:var(--glow)}
input[type=range]::-moz-range-thumb{width:26px;height:26px;border:0;border-radius:50%;background:var(--glow)}

/* story */
.sheet{position:absolute;inset:0;z-index:5;background:var(--black);overflow-y:auto;-webkit-overflow-scrolling:touch}
.story-in{max-width:680px;margin:0 auto;padding-top:calc(env(safe-area-inset-top,0px) + 100px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 72px);padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:grid;gap:30px}
.story-in .title{font-size:clamp(38px,9vw,60px)}
.story-in .lead{font-size:19px;max-width:none}
.story-in h3{font:400 26px/1.2 var(--serif);margin-bottom:-12px}
.story-in > p{font-size:18px;max-width:58ch}
.list{list-style:none;margin:0;padding:0;display:grid;gap:22px}
.list li{display:grid;gap:4px}
.list .y{font:400 24px/1.2 var(--serif);color:var(--glow)}
.list p{font-size:17px;max-width:58ch}
.list b{font:400 20px/1.3 var(--serif);color:var(--ink)}
.links{display:flex;flex-wrap:wrap;gap:8px 28px}
.links a{color:var(--ink);font-size:17px;text-underline-offset:6px;text-decoration-color:var(--faint)}

#nogl{position:absolute;inset:0;z-index:9;display:grid;place-items:center;padding:24px;text-align:center;font-size:18px;background:var(--black)}
@media (prefers-reduced-motion: reduce){.spot::after{animation:none}.toast,.guide{transition:none}}
</style>

<div id="app">
  <video id="cam" playsinline muted autoplay hidden></video>
  <canvas id="gl" aria-hidden="true"></canvas>

  <section id="home" class="screen" aria-label="Здания маршрута">
    <p class="brand">Самара <span>сквозь время</span></p>
    <div class="pager" id="pager"></div>
    <div class="dots" id="dots" aria-label="Выбор здания"></div>
    <div class="arrows">
      <button id="prev" aria-label="Предыдущее здание"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12.5 4 6.5 10l6 6"/></svg></button>
      <button id="next" aria-label="Следующее здание"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m7.5 4 6 6-6 6"/></svg></button>
    </div>
  </section>

  <section id="ar" class="screen" hidden aria-label="Просмотр на месте">
    <div id="spots"></div>
    <div class="reticle" id="reticle" hidden><svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="1.1"><path d="M2 18V2h16M82 2h16v16M98 82v16H82M18 98H2V82"/><path d="M47 50h6M50 47v6" stroke-width=".7"/></svg></div>
    <div class="guide" id="guide" hidden><svg viewBox="0 0 30 30" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 7 10 15l8 8"/></svg><span id="guideText"></span></div>
    <p class="toast" id="toast"></p>
    <div class="bar" id="bar" hidden>
      <div class="bar-in">
        <div class="card" id="card" hidden><h3 id="cardTitle"></h3><p id="cardText"></p></div>
        <div class="aim" id="aimPanel" hidden><p id="aimText"></p><div class="cta"><button class="btn" id="lockBtn">Закрепить здесь</button></div></div>
        <div class="ctl" id="liveCtl">
          <div class="bar-head"><h2 id="arTitle"></h2><button class="link" id="arStory">История</button></div>
          <div class="time"><label for="time">Сейчас</label><input type="range" id="time" min="0" max="100" value="100"><span class="y" id="timeYear"></span></div>
        </div>
      </div>
    </div>
    <div class="onboard" id="onboard">
      <div class="panel">
        <p class="when" id="obWhen"></p>
        <h2 class="title" id="obTitle"></h2>
        <p class="lead" id="obView"></p>
        <div class="cta"><button class="btn" id="startCam">Включить камеру</button><button class="link" id="startDemo">Смотреть без камеры</button></div>
      </div>
    </div>
    <button class="round" id="arClose" aria-label="Закрыть"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m3 3 12 12M15 3 3 15"/></svg></button>
    <button class="round right" id="reaim" hidden aria-label="Переставить здание"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="9" cy="9" r="5.5"/><path d="M9 0v4M9 14v4M0 9h4M14 9h4"/></svg></button>
  </section>

  <section id="story" class="sheet" hidden role="dialog" aria-modal="true" aria-label="История здания">
    <button class="round" id="stClose" aria-label="Закрыть"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m3 3 12 12M15 3 3 15"/></svg></button>
    <div class="story-in" id="storyIn"></div>
  </section>

  <div id="nogl" hidden><p>Этому браузеру не хватает WebGL для трёхмерной модели. Откройте страницу в свежем Safari или Chrome.</p></div>
</div>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

const $ = s => document.querySelector(s);
const D2R = Math.PI / 180;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const ease = t => 1 - Math.pow(1 - t, 3);
const wrap = a => Math.atan2(Math.sin(a), Math.cos(a));
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const EYE = 1.6;              // camera height above the street, metres
const DECLINATION = 12 * D2R; // magnetic declination in Samara: compass north points ~12° east of true north

/* ================= Geometry kit: buildings are assembled from extruded walls with real window openings ================= */
const I = new THREE.Matrix4();
const M = (x = 0, y = 0, z = 0, ry = 0, rx = 0, rz = 0) =>
  new THREE.Matrix4().compose(new THREE.Vector3(x, y, z), new THREE.Quaternion().setFromEuler(new THREE.Euler(rx, ry, rz, 'YXZ')), new THREE.Vector3(1, 1, 1));
const at = (m, ...a) => m.clone().multiply(M(...a));

class Kit {
  constructor() { this.parts = []; this.lines = []; }
  add(g, m = I) {
    if (g.index) g = g.toNonIndexed();
    for (const k of Object.keys(g.attributes)) if (k !== 'position' && k !== 'normal') g.deleteAttribute(k);
    g.applyMatrix4(m);
    this.parts.push(g);
  }
  line(pts, m = I) {
    const v = pts.map(p => new THREE.Vector3(...p).applyMatrix4(m));
    for (let i = 0; i < v.length - 1; i++) this.lines.push(v[i], v[i + 1]);
  }
}
const box = (w, h, d) => new THREE.BoxGeometry(w, h, d).translate(0, h / 2, 0);
const cyl = (r, h, n = 32) => new THREE.CylinderGeometry(r, r, h, n).translate(0, h / 2, 0);
function opening(cx, y0, w, h, rect) {
  const r = w / 2, p = new THREE.Path();
  p.moveTo(cx - r, y0); p.lineTo(cx + r, y0);
  if (rect) { p.lineTo(cx + r, y0 + h); p.lineTo(cx - r, y0 + h); }
  else { p.lineTo(cx + r, y0 + h - r); p.absarc(cx, y0 + h - r, r, 0, Math.PI, false); }
  p.lineTo(cx - r, y0);
  return p;
}
function panel(w, h, t, holes = []) {
  const s = new THREE.Shape();
  s.moveTo(-w / 2, 0); s.lineTo(w / 2, 0); s.lineTo(w / 2, h); s.lineTo(-w / 2, h); s.lineTo(-w / 2, 0);
  for (const o of holes) s.holes.push(opening(...o));
  return new THREE.ExtrudeGeometry(s, { depth: t, bevelEnabled: false, curveSegments: 8 }).translate(0, 0, -t / 2);
}
const row = (n, span, y0, w, h, rect) => Array.from({ length: n }, (_, i) => [-span / 2 + span * (i + .5) / n, y0, w, h, rect]);
function block(k, m, { w, d, h, t = .5, front = [], back = front, side = [], roof = true }) {
  k.add(panel(w + t, h, t, front), at(m, 0, 0, d / 2));
  k.add(panel(w + t, h, t, back), at(m, 0, 0, -d / 2, Math.PI));
  k.add(panel(d - t, h, t, side), at(m, w / 2, 0, 0, Math.PI / 2));
  k.add(panel(d - t, h, t, side), at(m, -w / 2, 0, 0, -Math.PI / 2));
  if (roof) k.add(box(w + t, .4, d + t), at(m, 0, h));
}
function drum(k, m, { r, h, n, t = .4, holes = [] }) {
  const w = 2 * r * Math.tan(Math.PI / n);
  for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2; k.add(panel(w, h, t, holes), at(m, Math.sin(a) * r, 0, Math.cos(a) * r, a)); }
}
function dome(k, m, { r, h, point = 0, ribs = 8 }) {
  const pts = [];
  for (let i = 0; i <= 16; i++) { const a = i / 16 * Math.PI / 2; pts.push(new THREE.Vector2(Math.max(.001, r * Math.cos(a)), h * Math.sin(a))); }
  if (point) pts.push(new THREE.Vector2(.001, h + point));
  k.add(new THREE.LatheGeometry(pts, 32), m);
  for (let i = 0; i < ribs; i++) { const b = i / ribs * Math.PI * 2; k.line(pts.map(p => [Math.sin(b) * p.x, p.y, Math.cos(b) * p.x]), m); }
}
function cross(k, m, h, s = 1) {
  k.add(box(.24 * s, h, .24 * s), m);
  k.add(box(1.7 * s, .22 * s, .22 * s), at(m, 0, h * .74));
  k.add(box(1.1 * s, .2 * s, .2 * s), at(m, 0, h * .4, 0, 0, 0, .35));
}
function arches(W, n, t) {
  const r = W / n / 2, s = new THREE.Shape();
  s.moveTo(-W / 2, 0);
  for (let i = 0; i < n; i++) s.absarc(-W / 2 + r * (2 * i + 1), 0, r, Math.PI, 0, true);
  s.lineTo(-W / 2, 0);
  return new THREE.ExtrudeGeometry(s, { depth: t, bevelEnabled: false, curveSegments: 18 }).translate(0, 0, -t / 2);
}
function frustum(bw, bd, tw, td, h) {
  const B = [[-bw / 2, 0, bd / 2], [bw / 2, 0, bd / 2], [bw / 2, 0, -bd / 2], [-bw / 2, 0, -bd / 2]];
  const T = [[-tw / 2, h, td / 2], [tw / 2, h, td / 2], [tw / 2, h, -td / 2], [-tw / 2, h, -td / 2]];
  const pos = [], quad = (a, b, c, d) => pos.push(...a, ...b, ...c, ...a, ...c, ...d);
  for (let i = 0; i < 4; i++) { const j = (i + 1) % 4; quad(B[i], B[j], T[j], T[i]); }
  quad(T[0], T[1], T[2], T[3]);
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.computeVertexNormals();
  return g;
}
// Horizontal slab shaped as a ring sector; angles run from +z toward +x
function sector(r1, r2, a0, a1, t) {
  const s = new THREE.Shape(), p0 = a0 - Math.PI / 2, p1 = a1 - Math.PI / 2;
  s.absarc(0, 0, r2, p0, p1, false);
  s.absarc(0, 0, r1, p1, p0, true);
  return new THREE.ExtrudeGeometry(s, { depth: t, bevelEnabled: false, curveSegments: 64 }).rotateX(-Math.PI / 2);
}

/* ================= The three buildings, in metres. Local +z faces the viewer ================= */
function buildSobor() {
  const k = new Kit();
  const wallHoles = [...row(4, 30, 3, 2.4, 7), ...row(3, 30, 12.6, 2.2, 5.4)];
  block(k, I, { w: 34, d: 34, h: 20, t: 1.2, front: wallHoles, side: wallHoles });
  for (const a of [0, Math.PI / 2, Math.PI, -Math.PI / 2]) k.add(arches(34, 3, 1.2), M(Math.sin(a) * 17, 20.4, Math.cos(a) * 17, a));
  k.add(new THREE.CylinderGeometry(9, 9, 16, 32, 1, true, Math.PI / 2, Math.PI).translate(0, 8, 0), M(0, 0, -17));

async function startView(withCamera) {
  $('#onboard').hidden = true; $('#bar').hidden = false;
  if (!withCamera) { toast('Тяните пальцем, чтобы осмотреться. Ползунок внизу возвращает в наше время.'); return; }

  let motion = Promise.resolve('granted');
  if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function')
    motion = DeviceOrientationEvent.requestPermission().catch(() => 'denied');

  try {
    if (!navigator.mediaDevices?.getUserMedia) throw new Error('unsupported');
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false });
  } catch (e) { camErr = e; }
  if (camErr) {
    toast(camErr.name === 'NotAllowedError' ? 'Нет доступа к камере. Разрешите его в настройках браузера и откройте снова.' : 'Камера в этом окне недоступна. Откройте ссылку проекта в Safari или Chrome на телефоне.', 6500);
    return;
  }
  video.srcObject = stream; video.hidden = false;
  await video.play().catch(() => {});
  S.live = true; $('#app').classList.add('live');
  ground.visible = false; nowG.visible = false;

  const motionOk = await motion === 'granted';

    S.fix = { lat: p.coords.latitude, lon: p.coords.longitude, acc: p.coords.accuracy };
  }, () => {}, { enableHighAccuracy: true, maximumAge: 3000, timeout: 20000 });
  S.fov = viewFov();
  for (let i = 0; i < 12 && !sensor.ok; i++) await new Promise(r => setTimeout(r, 150));
  if (S.mode !== 'ar') return;
  S.sensors = sensor.ok;
  if (S.sensors) { camera.quaternion.copy(sensorQuat()); aim(true); return; }
  placeAt(0, PLACES[S.idx].dist); reveal();
  toast(motionOk ? 'Датчики движения не отвечают, поэтому модель стоит на месте экрана. Совместите её пальцем.' : 'Без доступа к датчикам движения модель стоит на месте экрана. Совместите её пальцем.', 6500);
}

    const dx = p[0].x - g0.p[0].x, dy = p[0].y - g0.p[0].y;
    if (Math.hypot(dx, dy) > 6) moved = true;
    if (!moved) return;
    if (S.live) { S.az = g0.az + dx / W * hf; S.yOff = g0.yOff - dy / H * 2 * S.dist * Math.tan(vf / 2); }
    else { S.yaw = g0.yaw + dx / W * hf; S.pitch = clamp(g0.pitch + dy / H * vf, -1.2, 1.2); }
  } else if (p.length >= 2 && g0.d) {
    moved = true;
    const d = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y), ang = Math.atan2(p[1].y - p[0].y, p[1].x - p[0].x);
    if (S.live) { S.scale = clamp(g0.scale * d / g0.d, .15, 6); S.twist = g0.twist - wrap(ang - g0.ang); }
    else S.fov = clamp(g0.fov * g0.d / d, 18, 85);
  }
});
const endPtr = e => {
  if (!ptrs.has(e.pointerId)) return;
  ptrs.delete(e.pointerId);
  if (ptrs.size) return snap();
  if (!moved) {
    const now = performance.now();
    if (now - lastTap < 320) { if (S.live) { if (S.sensors) aim(true); } else { S.yaw = 0; S.pitch = Math.atan2(S.m.height * .42 - EYE, S.dist) * .9; S.fov = viewFov(); } }
    else if (S.spot >= 0) selectSpot(S.spot);
    lastTap = now;
  }
  g0 = null;
};
canvas.addEventListener('pointerup', endPtr);
canvas.addEventListener('pointercancel', endPtr);
canvas.addEventListener('wheel', e => {
  if (S.mode !== 'ar') return;
  e.preventDefault();
  const k = Math.exp(e.deltaY * .0012);
  if (S.live) S.scale = clamp(S.scale / k, .15, 6); else S.fov = clamp(S.fov * k, 18, 85);
}, { passive: false });

/* ================= Frame loop ================= */
const spotV = new THREE.Vector3();
let last = performance.now();
function updateAR(t, dt) {
  const W = innerWidth, H = innerHeight, p = PLACES[S.idx];
  camera.fov += (S.fov - camera.fov) * Math.min(1, dt * 10);
  if (S.live && S.sensors) {
    // adaptive smoothing: calm when the phone is held still, immediate when it turns
    const q = sensorQuat(), ang = camera.quaternion.angleTo(q);
    camera.quaternion.slerp(q, 1 - Math.exp(-dt * (ang > .035 ? 30 : 12)));
  } else if (S.live) {
    camera.rotation.set(0, 0, 0);
  } else {
    // camera-less: slow drift so the 3D reads, plus the look-around from dragging
    camera.position.set(Math.sin(t * .00011) * 4, EYE, Math.cos(t * .00008) * 2);
    camera.rotation.set(S.pitch, S.yaw, 0, 'YXZ');
  }
  if (S.live) camera.position.set(0, EYE, 0);
  camera.updateProjectionMatrix();
  camera.updateMatrixWorld(true);

  const guide = $('#guide'), hf = 2 * Math.atan(Math.tan(camera.fov * D2R / 2) * W / H), yaw = camYaw();
  let guideDir = 0, guideText = p.short;
  if (S.aiming) {
    const est = estimate();
    S.az = yaw; S.dist = est ? est.d : p.dist;
    let onTarget = false;
    if (est) { const diff = wrap(est.az - yaw); onTarget = Math.abs(diff) < 10 * D2R; if (!onTarget) { guideDir = Math.sign(diff); guideText = diff < 0 ? 'Левее' : 'Правее'; } }
    if (onTarget !== S.aimOn) {
      S.aimOn = onTarget;
      $('#reticle').classList.toggle('on', onTarget);
      $('#aimText').textContent = onTarget ? `Здание в этой стороне, примерно в ${Math.round(est.d)} м. Совместите рамку и закрепите.` : p.aim;
    }
  }
  anchor.position.set(Math.sin(S.az) * S.dist, S.yOff, -Math.cos(S.az) * S.dist);
  anchor.rotation.set(0, -S.az + S.twist, 0);
  anchor.scale.setScalar(S.scale);
  anchor.updateMatrixWorld(true);

  // when locked and out of frame, point back to the building
  if (S.live && !S.aiming) {
    const off = wrap(S.az - yaw);
    if (Math.abs(off) > hf / 2) guideDir = Math.sign(off);
  }
  guide.hidden = !guideDir;
  if (guideDir) { guide.className = 'guide ' + (guideDir < 0 ? 'l' : 'r'); $('#guideText').textContent = guideText; }

  // facade points follow the model on screen
  const show = U.uReveal.value > .97 && S.past > .35 && !S.aiming && $('#onboard').hidden;
  spotEls.forEach((el, i) => {
    let vis = show;
    if (vis) {
      const q = p.spots[i].p;
      spotV.set(q[0], q[1], q[2]).applyMatrix4(holoG.matrixWorld).project(camera);
      vis = spotV.z < 1 && Math.abs(spotV.x) < 1.02 && Math.abs(spotV.y) < 1.02;
      if (vis) el.style.transform = `translate3d(${((spotV.x + 1) / 2 * W).toFixed(1)}px, ${((1 - spotV.y) / 2 * H).toFixed(1)}px, 0)`;
    }
    if (el.hidden === vis) el.hidden = !vis;
  });
}
const storyEl = $('#story');
function frame(t) {
  requestAnimationFrame(frame);
  const raw = (t - last) / 1000; last = t;
  if (document.hidden || !storyEl.hidden) return;
  const dt = Math.min(.05, raw);
  if (raw < .25) {
    Q.acc += raw; Q.n++;
    if (Q.n >= 90) {
      if (Q.acc / Q.n > 1 / 45 && Q.dpr > 1) { Q.dpr = Math.max(1, Q.dpr - .25); applyQuality(); }
      Q.acc = 0; Q.n = 0;
    }
  }
  U.uTime.value = t / 1000;
  if (S.revealAt >= 0) U.uReveal.value = ease(clamp((t - S.revealAt) / S.revealDur, 0, 1));
  U.uOpacity.value = S.mode === 'home' ? 1 : S.past * (S.aiming ? .4 : 1);
  if (S.mode === 'home') {
    anchor.rotation.y += dt * (reduceMotion ? .03 : .14);
    nowG.visible = false; ground.visible = true;
  } else {
    nowG.visible = !S.live;
    updateAR(t, dt);
  }
  const hide = [ground, nowG], vis = hide.map(o => o.visible);
  hide.forEach(o => { o.visible = false; });
  bloomComposer.render();
  hide.forEach((o, i) => { o.visible = vis[i]; });
  finalComposer.render();
}
function applyQuality() {
  renderer.setPixelRatio(Q.dpr);
  finalComposer.setPixelRatio(Q.dpr);
  bloomComposer.setPixelRatio(Q.dpr * .5);
  U.uPx.value = Q.dpr;
  resize();
}
function resize() {
  const W = innerWidth, H = innerHeight;
  renderer.setSize(W, H, false);
  bloomComposer.setSize(W, H); finalComposer.setSize(W, H);
  camera.aspect = W / H;
  if (S.mode === 'home') homeCamera(); else { S.fov = viewFov(); camera.updateProjectionMatrix(); }
}
addEventListener('resize', resize);
video.addEventListener('loadedmetadata', () => { S.fov = viewFov(); });

/* ================= Boot ================= */
showPlace(0);
setDots(0);
resize();
requestAnimationFrame(frame);
// build the other buildings while the first one materializes
setTimeout(() => { model(1); setTimeout(() => model(2), 200); }, 1200);
const fromHash = PLACES.findIndex(p => p.id === location.hash.slice(1));
if (fromHash >= 0) { pager.scrollLeft = fromHash * pager.clientWidth; showPlace(fromHash); setDots(fromHash); homeCamera(); openAR(fromHash); }
</script>
